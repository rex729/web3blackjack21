apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: uck729/web3blackjack-backend:latest # 請替換為您的實際映像檔
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
        env:
        - name: PORT
          value: "4000"
        - name: JWT_SECRET
          value: "mock-jwt-secret-for-local-dev-only" # 生產環境請改用 K8s Secrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: blackjack-db-secret
              key: DATABASE_URL
        # - name: REDIS_HOST
        #   value: "redis-service" # 若稍後啟用 Redis
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
  type: ClusterIP
